name: TicketSystem
version: '${project.version}'
main: com.github.henriquemb.ticketsystem.TicketSystem
api-version: '26.2'
description: Тикеты, жалобы и предложения для игроков
authors: [ henriquemb ]
# Скачиваются сервером при первом запуске (пул соединений и драйверы баз данных)
libraries:
  - com.zaxxer:HikariCP:7.1.0
  - com.mysql:mysql-connector-j:9.6.0
  - org.xerial:sqlite-jdbc:3.51.3.0
commands:
  ticketmenu:
    description: Открыть меню тикетов
    usage: /ticketmenu
    aliases:
      - tmenu
  ticket:
    description: Задать вопрос администрации
    usage: /ticket <вопрос>
    aliases:
      - vopros
      - help-me
  tickets:
    description: Список тикетов
    usage: /tickets [страница] [-a | -p <ник>]
  report:
    description: Пожаловаться на игрока
    usage: /report <ник> [доказательство] [причина]
    aliases:
      - zhaloba
  reports:
    description: Список жалоб
    usage: /reports [страница] [-a]
    aliases:
      - zhaloby
  suggestion:
    description: Отправить предложение
    usage: /suggestion <предложение>
    aliases:
      - predlozhenie
      - idea
  suggestions:
    description: Список предложений
    usage: /suggestions [страница] [-a]
    aliases:
      - predlozheniya
      - ideas
  support:
    description: Объявить, что вы готовы помочь игрокам
    usage: /support
    aliases:
      - pomosh
      - helping
  ticketsystem:
    description: Перезагрузить конфигурацию плагина
    usage: /ticketsystem reload
    aliases:
      - ts
permissions:
  ticketsystem.ticket.use:
    description: Создавать тикеты и оценивать ответы
    default: true
  ticketsystem.report.use:
    description: Отправлять жалобы
    default: true
  ticketsystem.suggestion.use:
    description: Отправлять предложения
    default: true
  ticketsystem.ticket.staff:
    description: Просматривать тикеты, отвечать на них, /support
    default: op
  ticketsystem.report.staff:
    description: Просматривать жалобы и менять их статус
    default: op
  ticketsystem.suggestion.staff:
    description: Просматривать предложения и отвечать на них
    default: op
  ticketsystem.ticket.admin:
    description: Статистика персонала, отмена оценок
    default: op
  ticketsystem.admin:
    description: Перезагрузка плагина
    default: op
  ticketsystem.bypass.antispam:
    description: Без задержек и лимитов на тикеты, жалобы и предложения
    default: op
